<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BusHub</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-screen overflow-hidden font-sans select-none flex flex-col justify-between antialiased bg-[var(--bg-main)] text-[var(--text-main)]">

    <!-- En-tête -->
    <header class="h-16 border-b border-[var(--border-color)] bg-[var(--bg-surface)] px-4 flex items-center justify-between shrink-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-[var(--accent)] flex items-center justify-center font-bold text-xs text-black tracking-wider shrink-0">
                BH
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="font-semibold text-xs tracking-wide">BusHub Direct</h1>
                    <!-- Bouton Reload (Need Network) -->
                    <button id="reload-btn" title="Recharger depuis le réseau" class="p-1 rounded-md bg-[var(--bg-element)] border border-[var(--border-color)] text-[var(--text-muted)] hover:text-white active:scale-95 transition flex items-center justify-center">
                        <svg id="reload-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                </div>
                <span id="today-badge" class="text-[10px] font-mono text-[var(--text-muted)]">Aujourd'hui</span>
            </div>
        </div>
        
        <!-- Filtres Catégories -->
        <div class="flex items-center bg-[var(--bg-element)] p-1 rounded-xl border border-[var(--border-color)]">
            <button id="filter-all" class="filter-btn px-3 py-1 rounded-lg text-xs font-medium bg-[var(--accent)] text-black transition">Tout</button>
            <button id="filter-photo" class="filter-btn px-3 py-1 rounded-lg text-xs font-medium text-[var(--text-muted)] transition">📷 Photos</button>
            <button id="filter-video" class="filter-btn px-3 py-1 rounded-lg text-xs font-medium text-[var(--text-muted)] transition">🎥 Vidéos</button>
        </div>
    </header>

    <!-- Flux Média -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4 max-w-lg mx-auto w-full" id="feed-container">
        <!-- Contenu dynamique -->
    </main>

    <!-- Pied de page : Prise de vue -->
    <footer class="h-20 border-t border-[var(--border-color)] bg-[var(--bg-surface)] flex items-center justify-center shrink-0">
        <label for="camera-input" class="cursor-pointer group flex items-center justify-center">
            <div class="w-14 h-14 rounded-full border border-[var(--border-color)] bg-[var(--bg-element)] flex items-center justify-center transition group-active:scale-95 group-hover:border-[var(--accent)] shadow-md">
                <div class="w-10 h-10 rounded-full bg-[var(--accent)]"></div>
            </div>
        </label>
        <input type="file" id="camera-input" accept="image/*,video/*" class="hidden">
    </footer>

    <script src="app.js"></script>
</body>
</html>
